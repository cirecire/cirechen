<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Study Materials</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #fff;
    --text: #1e293b;
    --text-secondary: #475569;
    --border: #cbd5e1;
    --shadow: rgba(0,0,0,0.08);
    --math-bg: #1e40af;
    --math-hover: #1e3a8a;
    --phys-bg: #0f766e;
    --phys-hover: #115e59;
    --chem-bg: #7c3aed;
    --chem-hover: #6d28d9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .header p {
    font-size: 16px;
    color: var(--text-secondary);
  }

  /* Step indicator */
  .steps {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
  }
  .step.active .step-num {
    background: var(--phys-bg);
    color: #fff;
  }
  .step.done .step-num {
    background: var(--text-secondary);
    color: #fff;
  }
  .step-label { font-weight: 500; }
  .step-arrow { color: var(--border); font-size: 18px; }

  /* Subject cards */
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .subject-grid {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 48px;
  }
  .subject-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 40px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
    min-width: 160px;
  }
  .subject-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .subject-card.selected {
    border-color: transparent;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .subject-card.selected.math { background: var(--math-bg); color: #fff; border-color: var(--math-bg); }
  .subject-card.selected.phys { background: var(--phys-bg); color: #fff; border-color: var(--phys-bg); }
  .subject-card.selected.chem { background: var(--chem-bg); color: #fff; border-color: var(--chem-bg); }

  .subject-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .subject-card.selected .subject-icon { background: rgba(255,255,255,0.2); }
  .math .subject-icon { background: #dbeafe; }
  .phys .subject-icon { background: #ccfbf1; }
  .chem .subject-icon { background: #ede9fe; }

  .subject-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }
  .subject-card.selected .subject-name { color: #fff; }
  .subject-desc {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .subject-card.selected .subject-desc { color: rgba(255,255,255,0.8); }

  /* Grade grid */
  .grade-grid {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .grade-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 20px 28px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
    min-width: 120px;
  }
  .grade-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .grade-card.selected {
    border-color: transparent;
    background: var(--text);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .grade-num {
    font-size: 22px;
    font-weight: 800;
  }
  .grade-label {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .grade-card.selected .grade-label { color: rgba(255,255,255,0.7); }

  /* Go button */
  .action {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }
  .go-btn {
    padding: 14px 40px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }
  .go-btn.visible {
    display: block;
  }
  .go-btn:hover {
    background: #0f172a;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }

  /* Available modules hint */
  .modules-hint {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 20px;
  }

  /* Hidden sections */
  .hidden { display: none; }

  /* Responsive */
  @media (max-width: 600px) {
    .subject-grid { gap: 12px; }
    .subject-card { padding: 20px 24px; min-width: 130px; }
    .grade-grid { gap: 10px; }
    .grade-card { padding: 16px 20px; min-width: 90px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 Self-Study Materials</h1>
  <p>Select subject and grade to get started</p>
</div>

<!-- Step indicator -->
<div class="steps">
  <div class="step active" id="step1">
    <div class="step-num">1</div>
    <div class="step-label">Subject</div>
  </div>
  <div class="step-arrow">›</div>
  <div class="step" id="step2">
    <div class="step-num">2</div>
    <div class="step-label">Grade</div>
  </div>
  <div class="step-arrow">›</div>
  <div class="step" id="step3">
    <div class="step-num">→</div>
    <div class="step-label">Practice</div>
  </div>
</div>

<!-- Subject selection -->
<div id="subject-section">
  <div class="section-title">Which subject?</div>
  <div class="subject-grid">
    <div class="subject-card math" onclick="selectSubject('math', this)">
      <div class="subject-icon">📐</div>
      <div class="subject-name">Math</div>
      <div class="subject-desc">Algebra · Geometry · Stats…</div>
    </div>
    <div class="subject-card phys" onclick="selectSubject('phys', this)">
      <div class="subject-icon">⚙️</div>
      <div class="subject-name">Physics</div>
      <div class="subject-desc">Mechanics · Forces · Energy…</div>
    </div>
    <div class="subject-card chem" onclick="selectSubject('chem', this)">
      <div class="subject-icon">🧪</div>
      <div class="subject-name">Chemistry</div>
      <div class="subject-desc">Coming soon…</div>
    </div>
  </div>
</div>

<!-- Grade selection -->
<div id="grade-section" class="hidden">
  <div class="section-title">Which grade?</div>
  <div class="grade-grid" id="grade-grid"></div>
  <div class="action">
    <button class="go-btn" id="go-btn" onclick="go()">Open Practice →</button>
  </div>
  <div class="modules-hint" id="modules-hint"></div>
</div>

<script>
  // Route map: subject → grade → { label, path }
  const ROUTES = {
    math: {
      label: 'Math',
      grades: {
        5: { label: '5th Grade', path: 'math/grade5.html' },
        6: { label: '6th Grade', path: 'math/grade6.html' },
        7: { label: '7th Grade', path: 'math/grade7.html' },
        8: { label: '8th Grade', path: 'math/index.html' },
      }
    },
    phys: {
      label: 'Physics',
      grades: {
        5: { label: '5th Grade', path: 'physics/grade5.html' },
        6: { label: '6th Grade', path: 'physics/grade6.html' },
        7: { label: '7th Grade', path: 'physics/grade7.html' },
        8: { label: '8th Grade', path: 'physics/index.html' },
      }
    },
    chem: {
      label: 'Chemistry',
      grades: {
        8: { label: '8th Grade', path: 'chemistry/grade8.html' },
        9: { label: '9th Grade', path: 'chemistry/grade9.html' },
      }
    }
  };

  let selectedSubject = null;
  let selectedGrade = null;

  function selectSubject(subject, el) {
    // Clear previous
    document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedSubject = subject;

    // Show grade section
    document.getElementById('grade-section').classList.remove('hidden');
    document.getElementById('step2').classList.add('active');
    document.getElementById('step1').classList.add('done');
    document.getElementById('step1').querySelector('.step-num').textContent = '✓';

    // Build grade grid
    const routes = ROUTES[subject];
    const grid = document.getElementById('grade-grid');
    grid.innerHTML = '';
    for (const [g, info] of Object.entries(routes.grades)) {
      const card = document.createElement('div');
      card.className = 'grade-card';
      card.onclick = () => selectGrade(g, card);
      card.innerHTML = `<div class="grade-num">${g}</div><div class="grade-label">${info.label.replace(/^\d+\s/, '')}</div>`;
      grid.appendChild(card);
    }

    // Hint
    document.getElementById('modules-hint').textContent = '';

    // Scroll to grade section
    document.getElementById('grade-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function selectGrade(grade, el) {
    document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedGrade = grade;
    document.getElementById('step3').classList.add('active');
    document.getElementById('go-btn').classList.add('visible');
    document.getElementById('go-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function go() {
    if (!selectedSubject || !selectedGrade) return;
    const path = ROUTES[selectedSubject].grades[selectedGrade].path;
    window.location.href = path;
  }
</script>
</body>
</html>
