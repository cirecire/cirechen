<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Study Materials</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #fff;
    --text: #1e293b;
    --text-secondary: #475569;
    --border: #cbd5e1;
    --shadow: rgba(0,0,0,0.08);
    --math-bg: #1e40af;
    --phys-bg: #0f766e;
    --chem-bg: #7c3aed;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 15px;
    color: var(--text-secondary);
  }

  /* Step bar */
  .steps {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--border); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px;
  }
  .step.active .step-num { background: var(--text); color: #fff; }
  .step.done .step-num { background: var(--text-secondary); color: #fff; }
  .step-label { font-weight: 500; }
  .step-arrow { color: var(--border); font-size: 18px; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Grade cards */
  .grade-grid {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .grade-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 20px 28px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
    min-width: 110px;
  }
  .grade-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .grade-card.selected {
    border-color: transparent;
    background: var(--text);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .grade-num { font-size: 22px; font-weight: 800; }
  .grade-label { font-size: 12px; opacity: 0.7; }
  .grade-card.selected .grade-label { color: rgba(255,255,255,0.7); }

  /* Subject cards */
  .subject-grid {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 40px;
  }
  .subject-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 24px 36px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
    min-width: 140px;
  }
  .subject-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .subject-card.locked {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .subject-card.locked:hover { transform: none; box-shadow: 0 2px 8px var(--shadow); }
  .subject-card.selected.math { background: var(--math-bg); color: #fff; border-color: var(--math-bg); }
  .subject-card.selected.phys { background: var(--phys-bg); color: #fff; border-color: var(--phys-bg); }
  .subject-card.selected.chem { background: var(--chem-bg); color: #fff; border-color: var(--chem-bg); }

  .subject-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .subject-card.selected .subject-icon { background: rgba(255,255,255,0.2); }
  .math .subject-icon { background: #dbeafe; }
  .phys .subject-icon { background: #ccfbf1; }
  .chem .subject-icon { background: #ede9fe; }

  .subject-name { font-size: 16px; font-weight: 700; }
  .subject-card.selected .subject-name { color: #fff; }
  .subject-desc { font-size: 12px; color: var(--text-secondary); }
  .subject-card.selected .subject-desc { color: rgba(255,255,255,0.75); }

  /* Enter button */
  .action { display: flex; justify-content: center; margin-bottom: 32px; }
  .enter-btn {
    padding: 14px 48px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }
  .enter-btn.visible { display: block; }
  .enter-btn:hover {
    background: #0f172a;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }

  .modules-hint { text-align: center; font-size: 13px; color: var(--text-secondary); min-height: 20px; }

  .hidden { display: none; }

  @media (max-width: 600px) {
    .grade-grid { gap: 10px; }
    .grade-card { padding: 16px 20px; min-width: 85px; }
    .subject-grid { gap: 10px; }
    .subject-card { padding: 18px 20px; min-width: 110px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 Self-Study Materials</h1>
  <p>Pick your grade and subject to start</p>
</div>

<!-- Step indicator -->
<div class="steps">
  <div class="step active" id="step1">
    <div class="step-num">1</div>
    <div class="step-label">Grade</div>
  </div>
  <div class="step-arrow">›</div>
  <div class="step" id="step2">
    <div class="step-num">2</div>
    <div class="step-label">Subject</div>
  </div>
  <div class="step-arrow">›</div>
  <div class="step" id="step3">
    <div class="step-num">→</div>
    <div class="step-label">Enter</div>
  </div>
</div>

<!-- Step 1: Grade -->
<div id="grade-section">
  <div class="section-title">Which grade?</div>
  <div class="grade-grid" id="grade-grid"></div>
</div>

<!-- Step 2: Subject -->
<div id="subject-section" class="hidden">
  <div class="section-title">Which subject?</div>
  <div class="subject-grid" id="subject-grid"></div>
  <div class="action">
    <button class="enter-btn" id="enter-btn" onclick="go()">Enter →</button>
  </div>
  <div class="modules-hint" id="modules-hint"></div>
</div>

<script>
  // Grade → available subjects with path
  const ROUTES = {
    5: {
      label: 'Grade 5',
      subjects: {
        math:  { label: 'Math',      icon: '📐', path: 'math/grade5/index.html' },
        phys:  { label: 'Physics',   icon: '⚙️', path: 'physics/grade5/index.html' },
        chem:  { label: 'Chemistry', icon: '🧪', path: null }
      }
    },
    6: {
      label: 'Grade 6',
      subjects: {
        math:  { label: 'Math',      icon: '📐', path: 'math/grade6/index.html' },
        phys:  { label: 'Physics',   icon: '⚙️', path: 'physics/grade6/index.html' },
        chem:  { label: 'Chemistry', icon: '🧪', path: null }
      }
    },
    7: {
      label: 'Grade 7',
      subjects: {
        math:  { label: 'Math',      icon: '📐', path: 'math/grade7/index.html' },
        phys:  { label: 'Physics',   icon: '⚙️', path: 'physics/grade7/index.html' },
        chem:  { label: 'Chemistry', icon: '🧪', path: null }
      }
    },
    8: {
      label: 'Grade 8',
      subjects: {
        math:  { label: 'Math',      icon: '📐', path: 'math/index.html' },
        phys:  { label: 'Physics',   icon: '⚙️', path: 'physics/index.html' },
        chem:  { label: 'Chemistry', icon: '🧪', path: null }
      }
    }
  };

  let selectedGrade = null;
  let selectedSubject = null;

  // Build grade grid on load
  (function initGrades() {
    const grid = document.getElementById('grade-grid');
    for (const [g, info] of Object.entries(ROUTES)) {
      const card = document.createElement('div');
      card.className = 'grade-card';
      card.onclick = () => selectGrade(g, card);
      card.innerHTML = `<div class="grade-num">${g}</div><div class="grade-label">${info.label.replace(/^\d+\s/, '')}</div>`;
      grid.appendChild(card);
    }
  })();

  function selectGrade(grade, el) {
    document.querySelectorAll('.grade-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedGrade = grade;
    selectedSubject = null;

    // Show subject section
    document.getElementById('subject-section').classList.remove('hidden');
    document.getElementById('step2').classList.add('active');
    document.getElementById('step1').classList.add('done');
    document.getElementById('step1').querySelector('.step-num').textContent = '✓';
    document.getElementById('enter-btn').classList.remove('visible');
    document.getElementById('step3').classList.remove('active');

    // Build subject grid
    const gradeInfo = ROUTES[grade];
    const grid = document.getElementById('subject-grid');
    grid.innerHTML = '';
    for (const [subj, info] of Object.entries(gradeInfo.subjects)) {
      const card = document.createElement('div');
      const locked = !info.path;
      card.className = `subject-card ${subj}${locked ? ' locked' : ''}`;
      card.innerHTML = `
        <div class="subject-icon">${info.icon}</div>
        <div class="subject-name">${info.label}</div>
        <div class="subject-desc">${locked ? 'Coming soon…' : ''}</div>
      `;
      if (!locked) card.onclick = () => selectSubject(subj, card);
      grid.appendChild(card);
    }

    document.getElementById('subject-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function selectSubject(subj, el) {
    document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedSubject = subj;
    document.getElementById('step3').classList.add('active');
    document.getElementById('enter-btn').classList.add('visible');
    document.getElementById('enter-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function go() {
    if (!selectedGrade || !selectedSubject) return;
    const path = ROUTES[selectedGrade].subjects[selectedSubject].path;
    if (path) window.location.href = path;
  }
</script>
</body>
</html>
