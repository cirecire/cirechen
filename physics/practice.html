<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Practice</title>
<style>
/* Dark theme (default when no preference) */
:root, [data-theme="dark"] {
  --bg-primary: #0a0a1a;
  --bg-secondary: #12122a;
  --bg-card: #1a1a3e;
  --text-primary: #e8e8ff;
  --text-secondary: #a0a0c0;
  --accent-blue: #4fc3f7;
  --accent-green: #66bb6a;
  --accent-orange: #ffa726;
  --accent-red: #ef5350;
  --border: #2a2a5a;
  --shadow: rgba(0,0,0,0.3);
  --toggle-icon: "🌙";
}

/* Light theme */
[data-theme="light"] {
  --bg-primary: #f5f5f7;
  --bg-secondary: #ffffff;
  --bg-card: #ffffff;
  --text-primary: #1a1a2e;
  --text-secondary: #5a5a6e;
  --accent-blue: #0066cc;
  --accent-green: #2e7d32;
  --accent-orange: #ed6c02;
  --accent-red: #d32f2f;
  --border: #e0e0e5;
  --shadow: rgba(0,0,0,0.1);
  --toggle-icon: "☀️";
}

/* System preference fallback (only used when no manual choice) */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg-primary: #f5f5f7;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --text-primary: #1a1a2e;
    --text-secondary: #5a5a6e;
    --accent-blue: #0066cc;
    --accent-green: #2e7d32;
    --accent-orange: #ed6c02;
    --accent-red: #d32f2f;
    --border: #e0e0e5;
    --shadow: rgba(0,0,0,0.1);
    --toggle-icon: "☀️";
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg-primary: #0a0a1a;
    --bg-secondary: #12122a;
    --bg-card: #1a1a3e;
    --text-primary: #e8e8ff;
    --text-secondary: #a0a0c0;
    --accent-blue: #4fc3f7;
    --accent-green: #66bb6a;
    --accent-orange: #ffa726;
    --accent-red: #ef5350;
    --border: #2a2a5a;
    --shadow: rgba(0,0,0,0.3);
    --toggle-icon: "🌙";
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 8px; color: var(--accent-blue); }
.back-link { text-align: center; margin-bottom: 24px; }
.back-link a { color: var(--text-secondary); text-decoration: none; }
.back-link a:hover { color: var(--accent-blue); }

.practice-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 8px var(--shadow);
}
.practice-bar .ch-title { font-weight: 600; color: var(--accent-blue); font-size: 16px; }
.practice-bar .ch-en { color: var(--text-secondary); font-size: 14px; }
.practice-bar .spacer { flex: 1; }
.practice-bar .progress { color: var(--text-secondary); font-size: 14px; }
.practice-bar select {
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}
.theme-btn {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
  line-height: 1;
  transition: background 0.2s;
}
.theme-btn:hover { background: var(--bg-primary); }

.chapter-section { background: var(--bg-card); border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid var(--border); }
.header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.header h2 { color: var(--accent-blue); margin-bottom: 4px; }
.sub { color: var(--text-secondary); font-size: 14px; }
.subtopic { margin-bottom: 20px; }
.st-name {
  font-weight: 600;
  color: var(--accent-green);
  cursor: pointer;
  padding: 12px 16px;
  background: var(--bg-secondary);
  border-radius: 8px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.st-name:hover { background: var(--bg-primary); }
.st-name::before { content: "▶"; font-size: 10px; transition: transform 0.2s; }
.st-name.open::before { transform: rotate(90deg); }
.st-en { color: var(--text-secondary); font-weight: 400; margin-left: 8px; }
.subtopic-content { display: none; }
.subtopic-content.open { display: block; }

.question {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.q-num {
  background: var(--accent-blue);
  color: white;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px;
}
.diff { font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 500; }
.diff-easy { background: var(--accent-green); color: white; }
.diff-med { background: var(--accent-orange); color: white; }
.diff-hard { background: var(--accent-red); color: white; }
.q-body { color: var(--text-primary); margin-bottom: 16px; }

.elicit-box { margin-top: 16px; }
.elicit-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg-primary);
  border-radius: 6px;
  cursor: pointer;
  color: var(--accent-green);
  font-weight: 500;
  font-size: 14px;
}
.elicit-header:hover { background: var(--border); }
.elicit-header::before { content: "▶"; font-size: 10px; transition: transform 0.2s; }
.elicit-header.open::before { transform: rotate(90deg); }
.elicit-content { display: none; padding: 12px 0 0 0; }
.elicit-content.open { display: block; }

.btn-step {
  background: transparent;
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 8px;
  display: block;
  width: 100%;
  text-align: left;
}
.btn-step:hover { background: rgba(102, 187, 106, 0.1); }
.btn-step.done { background: var(--accent-green); color: white; border-color: var(--accent-green); }
.answer-box {
  background: rgba(102, 187, 106, 0.1);
  border-left: 3px solid var(--accent-green);
  padding: 12px 16px;
  margin-bottom: 12px;
  border-radius: 0 8px 8px 0;
  display: none;
}
</style>
</head>
<body>
<div class="container">
<h1>Physics Practice</h1>
<div class="back-link"><a href="index.html">← Video Index</a></div>

<div class="practice-bar">
  <span class="ch-title" id="bar-title">Loading...</span>
  <span class="ch-en" id="bar-en"></span>
  <span class="spacer"></span>
  <span class="progress" id="bar-progress"></span>
  <select id="chapter-select"><option value="">Select Chapter...</option></select>
  <button class="theme-btn" id="theme-btn" title="Toggle light/dark mode">☀️</button>
</div>

<div id="content"><p style="color:var(--accent-blue)">Loading...</p></div>
</div>

<script>
window.PRACTICE = {
  "Ch01_机械运动": {
    "title": "第1章 机械运动",
    "titleEn": "Ch01 Mechanical Motion",
    "note": "配套视频：可汗学院 Khan Academy（英文）。先看视频理解原理，再做下面的练习。",
    "subtopics": [
      {
        "name": "1.1 长度和时间的测量",
        "en": "Measurement",
        "problems": [
          {
            "en": "A student measures a pencil with a ruler and obtains 15.7 cm. What is the length in meters?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：铅笔长度 15.7 cm；求：长度（m）",
              "【知识点】长度单位换算：1 m = 100 cm，即 1 cm = 10⁻² m",
              "【思路】小单位(cm) → 大单位(m)，除以进率100",
              "【计算】15.7 cm = 15.7 ÷ 100 m = 0.157 m",
              "【检验】0.157 m = 15.7 cm，m 是大单位、数值变小 ✓",
              "Answer: 0.157 m"
            ]
          },
          {
            "en": "The period of a swinging pendulum is measured as 2.35 s. Express this time in milliseconds (ms).",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：周期 T = 2.35 s；求：T（ms）",
              "【知识点】时间单位换算：1 s = 1000 ms，即 1 ms = 10⁻³ s",
              "【思路】s → ms，乘以进率1000",
              "【计算】2.35 s = 2.35 × 1000 ms = 2350 ms",
              "【检验】1 s = 1000 ms，2.35 s → 2350 ms，数量级正确 ✓",
              "Answer: 2350 ms"
            ]
          },
          {
            "en": "A room is 5.2 m long and 3.8 m wide. What is the area of the room in cm²?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：长 5.2 m，宽 3.8 m；求：面积（cm²）",
              "【知识点】面积公式：S = 长 × 宽；1 m² = 10⁴ cm²",
              "【思路】两步走：①先算 m²，②再换算成 cm²",
              "【计算①】S = 5.2 × 3.8 = 19.76 m²",
              "【计算②】19.76 m² = 19.76 × 10000 = 197600 cm²",
              "【检验】19.76 × 10000，末尾加4个零 = 197600，数字无误 ✓",
              "Answer: 197600 cm²"
            ]
          },
          {
            "en": "A student measured the length of a table five times: 1.52 m, 1.53 m, 1.51 m, 1.54 m, 1.52 m. What is the average length?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：5次测量值；求：平均值",
              "【知识点】多次测量取平均值可减小误差",
              "【计算】平均值 = (1.52 + 1.53 + 1.51 + 1.54 + 1.52) ÷ 5",
              "分子相加：1.52 + 1.53 = 3.05；3.05 + 1.51 = 4.56；",
              "4.56 + 1.54 = 6.10；6.10 + 1.52 = 7.62",
              "7.62 ÷ 5 = 1.524 m",
              "【易错点】⚠️ 不要把单位弄混，结果保留3位小数",
              "Answer: 1.524 m"
            ]
          },
          {
            "en": "A stopwatch has a smallest division of 0.01 s. What is the uncertainty of a single measurement?",
            "zh": "",
            "diff": "hard",
            "sol": [
              "【审题】已知：分度值 0.01 s；求：测量不确定度",
              "【知识点】仪器的分度值决定测量精度；不确定度 = ±(分度值/2)",
              "【思路】最小分度是0.01 s，说明能读到小数点后第2位；误差范围是半格",
              "【计算】不确定度 = 0.01 s ÷ 2 = 0.005 s",
              "【易错点】⚠️ 不是 ±0.01 s（那是读数可能出现的最大偏差）",
              "【检验】分度值越小，测量精度越高；0.005 s 是合理的误差范围 ✓",
              "Answer: ± 0.005 s"
            ]
          }
        ]
      },
      {
        "name": "1.2 运动的描述",
        "en": "Reference Frame & Displacement",
        "problems": [
          {
            "en": "A bus travels 20 km north, then turns and travels 15 km south. What is the total distance traveled and the displacement?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：向北20 km，再向南15 km；求：总路程 & 位移",
              "【知识点】路程是路径总长（标量）；位移是起点到终点的直线距离（矢量）",
              "【计算①路程】总路程 = 20 + 15 = 35 km",
              "【计算②位移】位移 = 20 − 15 = +5 km（向北为正）",
              "【检验】位移方向与第一次行进方向一致（向北）✓",
              "Answer: 总路程 = 35 km；位移 = 5 km 向北"
            ]
          },
          {
            "en": "An object moves from position x = 3 m to x = −4 m along a straight line. What is the displacement?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：起点 x₁ = 3 m，终点 x₂ = −4 m；求：位移",
              "【知识点】位移公式：Δx = x₂ − x₁（规定正方向后）",
              "【计算】Δx = (−4) − 3 = −7 m",
              "【易错点】⚠️ 负号表示方向与正方向相反，不是大小",
              "【检验】起点在+3处，终点在−4处，起点→终点 = 向左7 m，−7 m 合理 ✓",
              "Answer: −7 m（方向与正方向相反）"
            ]
          },
          {
            "en": "A runner completes one full lap around a 400-m circular track. What are the total distance and net displacement?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：绕圆形跑道完整一圈（周长400 m）；求：总路程 & 位移",
              "【知识点】完整一圈后回到出发点，起点 = 终点",
              "【计算①总路程】= 400 m（一圈的长度）",
              "【计算②位移】= 0 m（起点到终点无移动）",
              "【检验】路程是标量（总路径长），位移是矢量（起点指向终点）✓",
              "Answer: 总路程 = 400 m；位移 = 0 m"
            ]
          },
          {
            "en": "A car moves 30 km east in 0.5 h, then 40 km west in 0.5 h. What is the average speed and average velocity?",
            "zh": "",
            "diff": "hard",
            "sol": [
              "【审题】已知：向东30 km（0.5h），向西40 km（0.5h）；求：平均速率 & 平均速度",
              "【知识点】平均速率 = 总路程/总时间；平均速度 = 总位移/总时间（含方向）",
              "【画示意图】←──40km──←──30km──→→→ 起点",
              "总路程 = 30 + 40 = 70 km；总时间 = 1 h",
              "【计算①平均速率】= 70 km ÷ 1 h = 70 km/h",
              "【计算②位移】设向东为正：位移 = (+30) + (−40) = −10 km（向西）",
              "【计算③平均速度】= (−10 km) ÷ 1 h = −10 km/h（向西）",
              "【易错点】⚠️ 速率和速度不同：速率只看大小，速度看大小+方向",
              "【检验】位移绝对值 < 总路程 → 速率 > 速度大小，符合题意 ✓",
              "Answer: 平均速率 = 70 km/h；平均速度 = 10 km/h 向西"
            ]
          }
        ]
      },
      {
        "name": "1.3 运动的快慢（速度）",
        "en": "Speed and Velocity",
        "problems": [
          {
            "en": "A car travels 240 km in 3 hours. What is its average speed in km/h and in m/s?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：路程240 km，时间3 h；求：平均速率（km/h 和 m/s）",
              "【知识点】平均速率 = 路程/时间；换算：1 km/h = 1000/3600 m/s ≈ 1/3.6 m/s",
              "【计算① km/h】v = 240 km ÷ 3 h = 80 km/h",
              "【计算② m/s】80 km/h = 80 × (1000/3600) ≈ 80 × 0.278 ≈ 22.2 m/s",
              "【检验】22.2 m/s × 3.6 ≈ 80 km/h，两种单位互相验证 ✓",
              "Answer: 80 km/h 或 22.2 m/s"
            ]
          },
          {
            "en": "A cyclist rides 18 km in 45 minutes. What is the average speed in m/s?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：路程18 km，时间45 min；求：平均速率（m/s）",
              "【知识点】单位统一：km→m（×1000），min→s（×60）",
              "【思路】先换算单位，再求速率",
              "【计算】18 km = 18000 m；45 min = 2700 s",
              "v = 18000 m ÷ 2700 s ≈ 6.67 m/s",
              "【易错点】⚠️ 45 min = 0.75 h 若转成 h 计算：18/0.75 = 24 km/h = 6.67 m/s 也可以，但要注意 m/s 要除以3.6",
              "【检验】6.67 m/s × 3.6 ≈ 24 km/h，再 × 0.75 h = 18 km ✓",
              "Answer: 6.67 m/s"
            ]
          },
          {
            "en": "An athlete runs 100 m in 10.2 s. What is her average speed?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：路程100 m，时间10.2 s；求：平均速率",
              "【知识点】平均速率 = 路程 ÷ 时间",
              "【计算】v = 100 m ÷ 10.2 s ≈ 9.80 m/s",
              "【检验】用科学计数法：9.80 ≈ 10 m/s，符合百米世界级运动员水平 ✓",
              "Answer: 9.80 m/s"
            ]
          },
          {
            "en": "A car accelerates from 20 m/s to 30 m/s in 5 s. What is its average acceleration?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：初速度 v₀ = 20 m/s，末速度 v = 30 m/s，时间 Δt = 5 s；求：平均加速度 a",
              "【知识点】加速度公式：a = (v − v₀) / Δt，单位：m/s²",
              "【计算】a = (30 − 20) / 5 = 10 / 5 = 2 m/s²",
              "【易错点】⚠️ 加速度单位是 m/s² 不是 m/s；a = 2 m/s² 表示每秒速度增加2 m/s",
              "【检验】速度增加了 10 m/s，时间5s，平均每秒增加2 m/s ✓",
              "Answer: 2 m/s²"
            ]
          }
        ]
      },
      {
        "name": "1.4 匀速直线运动",
        "en": "Uniform Linear Motion",
        "problems": [
          {
            "en": "An object moves at constant velocity v = 5 m/s. How far does it travel in 12 s?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：匀速 v = 5 m/s，时间 t = 12 s；求：路程 s",
              "【知识点】匀速直线运动公式：s = v × t",
              "【计算】s = 5 × 12 = 60 m",
              "【检验】每秒走5 m，12秒走60 m，符合物理意义 ✓",
              "Answer: 60 m"
            ]
          },
          {
            "en": "A train maintains a constant speed of 72 km/h. How long does it take to travel 30 km?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：速率72 km/h，路程30 km；求：时间 t",
              "【知识点】匀速运动：t = s / v",
              "【计算】t = 30 km ÷ 72 km/h = 0.417 h",
              "【单位转换】0.417 h × 60 ≈ 25 min",
              "【易错点】⚠️ 结果不要写0.417 h，要转成熟悉的分钟或秒",
              "【检验】25 min / 60 ≈ 0.417 h；72 km/h × 0.417 h ≈ 30 km ✓",
              "Answer: 约 25 分钟"
            ]
          }
        ]
      },
      {
        "name": "1.5 速度变化规律",
        "en": "Acceleration & Motion Graphs",
        "problems": [
          {
            "en": "A car accelerates from rest uniformly at 3 m/s². What is its velocity after 8 s?",
            "zh": "",
            "diff": "easy",
            "sol": [
              "【审题】已知：初速度 v₀ = 0（从静止），加速度 a = 3 m/s²，时间 t = 8 s；求：末速度 v",
              "【知识点】匀加速公式：v = v₀ + a × t",
              "【计算】v = 0 + 3 × 8 = 24 m/s",
              "【检验】每秒速度增加3 m/s，8秒后增加24 m/s ✓",
              "Answer: 24 m/s"
            ]
          },
          {
            "en": "An object starts from rest and accelerates at 4 m/s². How far does it travel in the first 5 s?",
            "zh": "",
            "diff": "med",
            "sol": [
              "【审题】已知：v₀ = 0，a = 4 m/s²，t = 5 s；求：路程 s",

  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("physicsTheme", next);
  document.getElementById("theme-btn").textContent = next === "light" ? "🌙" : "☀️";
}
document.getElementById("theme-btn").onclick = toggleTheme;
initTheme();

function getCh(){
  var p = new URLSearchParams(location.search).get("ch");
  if(!p) return DEFAULT_CH;
  p = decodeURIComponent(p);
  return CHAPTERS.indexOf(p) >= 0 ? p : DEFAULT_CH;
}

function escapeHtml(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function revealStep(pid, idx){
  var ans = document.getElementById("ans-" + pid + "-" + idx);
  var btn = document.getElementById("btn-" + pid + "-" + idx);
  if(ans) ans.style.display = "block";
  if(btn){
    btn.classList.add("done");
    btn.textContent = "Step " + (idx+1) + " Done";
  }
  var nextBtn = document.getElementById("btn-" + pid + "-" + (idx+1));
  if(nextBtn) nextBtn.style.display = "block";
}

function toggleSubtopic(id){
  var header = document.getElementById("st-header-" + id);
  var content = document.getElementById("st-content-" + id);
  if(header && content){
    header.classList.toggle("open");
    content.classList.toggle("open");
  }
}

function toggleElicit(pid){
  var header = document.getElementById("elicit-header-" + pid);
  var content = document.getElementById("elicit-content-" + pid);
  if(header && content){
    header.classList.toggle("open");
    content.classList.toggle("open");
  }
}

function countProblems(ch){
  var count = 0;
  (ch.subtopics || []).forEach(function(st){
    count += (st.problems || []).length;
  });
  return count;
}

function renderChapters(){
  var chKey = getCh();
  var C = window.PRACTICE[chKey];
  if(!C){
    document.getElementById("content").innerHTML = "<p>Chapter not found</p>";
    return;
  }
  document.getElementById("bar-title").textContent = C.title;
  document.getElementById("bar-en").textContent = C.titleEn;
  document.getElementById("bar-progress").textContent = countProblems(C) + " problems";
  
  var select = document.getElementById("chapter-select");
  select.innerHTML = '<option value="">Select Chapter...</option>';
  CHAPTERS.forEach(function(key){
    var ch = window.PRACTICE[key];
    var option = document.createElement("option");
    option.value = key;
    option.textContent = ch.title;
    if(key === chKey) option.selected = true;
    select.appendChild(option);
  });
  select.onchange = function(){
    if(this.value) window.location.href = "practice.html?ch=" + encodeURIComponent(this.value);
  };
  
  var html = '<div class="chapter-section">';
  html += '<div class="header"><h2>' + escapeHtml(C.title) + '</h2>';
  html += '<div class="sub">' + escapeHtml(C.titleEn) + '</div></div>';
  
  (C.subtopics || []).forEach(function(st, si){
    var stId = "st" + si;
    html += '<div class="subtopic">';
    html += '<div class="st-name" id="st-header-' + stId + '" onclick="toggleSubtopic(\'' + stId + '\')">' + escapeHtml(st.name);
    if(st.en) html += ' <span class="st-en">' + escapeHtml(st.en) + '</span>';
    html += '</div>';
    html += '<div class="subtopic-content open" id="st-content-' + stId + '">';
    
    (st.problems || []).forEach(function(p, pi){
      var pid = stId + "p" + pi;
      var diff = p.diff || "easy";
      var diffLabel = diff === "easy" ? "Basic" : diff === "med" ? "Medium" : "Hard";
      var diffClass = "diff-" + diff;
      
      html += '<div class="question">';
      html += '<div class="q-top"><span class="q-num">' + (pi+1) + '</span><span class="diff ' + diffClass + '">' + diffLabel + '</span></div>';
      html += '<div class="q-body">' + escapeHtml(p.en) + '</div>';
      
      var elicit = p.elicit || [];
      if(elicit.length > 0){
        html += '<div class="elicit-box">';
        html += '<div class="elicit-header" id="elicit-header-' + pid + '" onclick="toggleElicit(\'' + pid + '\')">';
        html += 'Show Guidance (' + elicit.length + ' steps)';
        html += '</div>';
        html += '<div class="elicit-content" id="elicit-content-' + pid + '">';
        elicit.forEach(function(e, ei){
          var initialDisplay = ei === 0 ? "block" : "none";
          html += '<button class="btn-step" id="btn-' + pid + '-' + ei + '" style="display:' + initialDisplay + '" onclick="revealStep(\'' + pid + '\',' + ei + ')">Step ' + (ei+1) + '</button>';
          html += '<div class="answer-box" id="ans-' + pid + '-' + ei + '">';
          html += '<div style="color:var(--accent-green);font-weight:600;margin-bottom:8px">' + escapeHtml(e.q) + '</div>';
          if(e.a) html += '<div style="color:#c8e6c9;padding-left:4px">=> ' + escapeHtml(e.a) + '</div>';
          html += '</div>';
        });
        html += '</div></div>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  document.getElementById("content").innerHTML = html;
}

renderChapters();
</script>
</body>
</html>
